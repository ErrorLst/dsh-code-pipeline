name: code agent
description: 基于 PTC 模式（Code Mode SDK）的子代理流水线：subagent_plan（规划，只读）/ subagent_impl（实现）/ subagent_review（评审，只读）三个派发工具（后台派发、每阶段独立 provider/model/思考等级/并发上限、派发消息整体落单个临时文件由子代理 read 读取），可独立或任意组合（仅规划 / 仅实现 / 仅评审+主代理合并 / 完整 plan→人工门→impl↔review），plan 结尾产出 「## Workstreams」切分表（互不重叠的文件所有权 + 依赖 + 验收），独立工作流并派 impl、各自按路径受限 diff 独立评审（integration 最后跑）；每阶段可配墙钟预算（每次派发独立计时、80% 软警告、100% 中断并索取收尾报告，按「续 / 拆 / 停」协议处置且续跑会重新起算，不等同于阶段不可用）；同一任务的多轮 review 用 pipeline_followup 续用同一个评审子代理（增量派发，零代码改动）；已屏蔽通用 subagent 派发工具。
